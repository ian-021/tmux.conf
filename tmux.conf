
# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
set -g pane-base-index 1

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left previous-window
bind -n M-Right next-window


bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Enable mouse mode
set -g mouse on

set -g prefix C-l

##### Display Menu ##### 

bind m display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  ".zshrc"            z  "display-popup -w 80% -h 80% -E 'vim ~/.zshrc'" \
  ".bashrc"            b  "display-popup -w 80% -h 80% -E 'vim ~/.bashrc'" \
  ".tmux.conf"        t  "display-popup -w 80% -h 80% -E 'vim ~/.tmux.conf'" \
  ".nvim"             v  "display-popup -w 80% -h 80% -E vim ~/.config/nvim" \
  "Exit"              q  ""


bind C-j display-popup -w 80% -h 80% -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"


bind-key m send-prefix

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-style dim
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-style fg=colour81
setw -g window-status-current-style bg=colour238
setw -g window-status-current-style bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138
setw -g window-status-style bg=colour235
setw -g window-status-style none
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

setw -g window-status-bell-style bold
setw -g window-status-bell-style fg=colour255
setw -g window-status-bell-style bg=colour1
set -g status-right "#[fg=colour81,bold]#S#[default] | #(whoami)@#H"

# TPM
set -g @plugin 'tmux-plugins/tpm'

# Save / restore tmux state
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'
